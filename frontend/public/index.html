<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#0f172a" />
        <meta name="description" content="Global Acqua RCA Tool - Root Cause Analysis and Audit Finding Management System for ISO 9001, ISO 14001, ISO 45001, FSSC 22000" />
        
        <!-- PWA Meta Tags -->
        <meta name="application-name" content="Global Acqua RCA Tool" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Global Acqua" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#0f172a" />
        <meta name="msapplication-tap-highlight" content="no" />
        
        <!-- Favicon and Icons -->
        <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/icons/icon-16x16.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="mask-icon" href="%PUBLIC_URL%/icons/icon.svg" color="#0f172a" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
        
        <title>Global Acqua RCA Tool</title>
        
        <style>
            /* Splash screen for PWA */
            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                transition: opacity 0.3s ease-out;
            }
            #splash-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #splash-screen svg {
                width: 80px;
                height: 80px;
                animation: pulse 2s ease-in-out infinite;
            }
            #splash-screen h1 {
                color: white;
                font-family: 'Manrope', sans-serif;
                font-size: 24px;
                margin-top: 16px;
                font-weight: 700;
            }
            #splash-screen p {
                color: #94a3b8;
                font-family: 'Inter', sans-serif;
                font-size: 14px;
                margin-top: 4px;
            }
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.05); opacity: 0.8; }
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        
        <!-- Splash Screen -->
        <div id="splash-screen">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <g transform="translate(128, 80)">
                    <path d="M128 0 C128 0 256 160 256 240 C256 328 199 352 128 352 C57 352 0 328 0 240 C0 160 128 0 128 0Z" fill="#3b82f6"/>
                    <ellipse cx="80" cy="200" rx="32" ry="48" fill="#60a5fa" opacity="0.6"/>
                    <ellipse cx="64" cy="176" rx="16" ry="24" fill="#93c5fd" opacity="0.8"/>
                </g>
            </svg>
            <h1>Global Acqua</h1>
            <p>RCA Tool</p>
        </div>
        
        <div id="root"></div>
        
        <script>
            // Hide splash screen when app loads
            window.addEventListener('load', function() {
                setTimeout(function() {
                    var splash = document.getElementById('splash-screen');
                    if (splash) {
                        splash.classList.add('hidden');
                        setTimeout(function() { splash.remove(); }, 300);
                    }
                }, 500);
            });
            
            // Register Service Worker for PWA
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
                        console.log('ServiceWorker registered: ', registration.scope);
                    }).catch(function(error) {
                        console.log('ServiceWorker registration failed: ', error);
                    });
                });
            }
        </script>
    </body>
</html>
